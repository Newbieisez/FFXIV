name: Route Reference Inventory

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/route-reference-inventory.yml
      - src/EZBuddy.Core/Research/**
      - tools/EZBuddy.RouteReferenceScanner/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout EZBuddy
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build clean-room reference scanner
        run: |
          dotnet restore tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj
          dotnet build tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj -c Release --no-restore

      - name: Inventory public reference ecosystems
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanner = Join-Path $PWD 'tools/EZBuddy.RouteReferenceScanner/bin/Release/net10.0/EZBuddy.RouteReferenceScanner.dll'
          $workspace = Join-Path $env:RUNNER_TEMP 'ezbuddy-route-reference-sources'
          $output = Join-Path $PWD 'artifacts/reference-manifests'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          # Public research/reference ecosystems. The scanner emits metadata-only manifests;
          # source bodies, copied mechanic implementations, and navigation coordinates are never
          # copied into EZBuddy artifacts.
          $sources = @(
            @{ Name = 'DomesticWarlord-RebornProfiles'; Url = 'https://github.com/DomesticWarlord/RebornProfiles.git' },
            @{ Name = 'LlamaMagic-DutyMechanic'; Url = 'https://github.com/LlamaMagic/DutyMechanic.git' },
            @{ Name = 'zzi-zzi-zzi-SideStep'; Url = 'https://github.com/zzi-zzi-zzi/SideStep.git' },
            @{ Name = 'athlon18-RBtrust'; Url = 'https://github.com/athlon18/RBtrust.git' },
            @{ Name = 'zzi-zzi-zzi-DeepDive'; Url = 'https://github.com/zzi-zzi-zzi/DeepDive.git' },
            @{ Name = 'nt153133-LlamaUtilities'; Url = 'https://github.com/nt153133/LlamaUtilities.git' },
            @{ Name = 'Ruach82-RB_Sodimm_Profiles'; Url = 'https://github.com/Ruach82/RB_Sodimm_Profiles.git' }
          )

          foreach ($source in $sources) {
            $destination = Join-Path $workspace $source.Name
            Write-Host "Cloning public reference source $($source.Name)..."
            git clone --depth 1 --no-tags $source.Url $destination
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Reference source $($source.Name) could not be cloned; continuing with the remaining sources."
              continue
            }

            $routeManifest = Join-Path $output "$($source.Name).routes.json"
            dotnet $scanner scan --source $source.Name --out $routeManifest --root $destination
            if ($LASTEXITCODE -ne 0) {
              throw "Route reference scanner failed for $($source.Name)."
            }

            $mechanicManifest = Join-Path $output "$($source.Name).mechanics.json"
            dotnet $scanner mechanics --source $source.Name --out $mechanicManifest --root $destination
            if ($LASTEXITCODE -ne 0) {
              throw "Plugin mechanic reference scanner failed for $($source.Name)."
            }
          }

          $routeManifests = Get-ChildItem $output -Filter '*.routes.json' -File
          $mechanicManifests = Get-ChildItem $output -Filter '*.mechanics.json' -File
          if (-not $routeManifests) {
            throw 'No public route-reference manifests were generated.'
          }
          if (-not $mechanicManifests) {
            throw 'No public plugin-mechanic reference manifests were generated.'
          }

          $matrixJson = Join-Path $output 'EZBuddy-duty-coverage-matrix.json'
          $matrixCsv = Join-Path $output 'EZBuddy-duty-coverage-matrix.csv'
          dotnet $scanner matrix --manifest-dir $output --out $matrixJson --csv $matrixCsv
          if ($LASTEXITCODE -ne 0) {
            throw 'Duty coverage matrix generation failed.'
          }

          Write-Host "Generated $($routeManifests.Count) route manifests, $($mechanicManifests.Count) mechanic manifests, and consolidated duty coverage JSON/CSV."

      - name: Upload clean-room reference manifests
        uses: actions/upload-artifact@v4
        with:
          name: EZBuddy-public-reference-manifests
          path: artifacts/reference-manifests/*
          if-no-files-found: error
          retention-days: 14
