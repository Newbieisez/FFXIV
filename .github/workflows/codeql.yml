name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore core
        run: dotnet restore src/EZBuddy.Core/EZBuddy.Core.csproj

      - name: Restore UI
        run: dotnet restore src/EZBuddy.UI/EZBuddy.UI.csproj

      - name: Restore plugin
        run: dotnet restore src/EZBuddy.Plugin/EZBuddy.Plugin.csproj

      - name: Restore botbase
        run: dotnet restore src/EZBuddy.BotBase/EZBuddy.BotBase.csproj

      - name: Restore license issuer
        run: dotnet restore tools/EZBuddy.LicenseIssuer/EZBuddy.LicenseIssuer.csproj

      - name: Restore route reference scanner
        run: dotnet restore tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj

      - name: Build core
        run: dotnet build src/EZBuddy.Core/EZBuddy.Core.csproj -c Release --no-restore

      - name: Build UI
        run: dotnet build src/EZBuddy.UI/EZBuddy.UI.csproj -c Release --no-restore -p:Platform=x64

      - name: Build plugin
        run: dotnet build src/EZBuddy.Plugin/EZBuddy.Plugin.csproj -c Release --no-restore -p:Platform=x64

      - name: Build botbase
        run: dotnet build src/EZBuddy.BotBase/EZBuddy.BotBase.csproj -c Release --no-restore -p:Platform=x64

      - name: Build license issuer
        run: dotnet build tools/EZBuddy.LicenseIssuer/EZBuddy.LicenseIssuer.csproj -c Release --no-restore

      - name: Build route reference scanner
        run: dotnet build tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v3
