name: EZBuddy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore plugin
        run: dotnet restore src/EZBuddy.Plugin/EZBuddy.Plugin.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Restore botbase
        run: dotnet restore src/EZBuddy.BotBase/EZBuddy.BotBase.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Restore license issuer
        run: dotnet restore tools/EZBuddy.LicenseIssuer/EZBuddy.LicenseIssuer.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Restore route reference scanner
        run: dotnet restore tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Restore core tests
        run: dotnet restore tests/EZBuddy.Core.Tests/EZBuddy.Core.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build plugin
        run: dotnet build src/EZBuddy.Plugin/EZBuddy.Plugin.csproj -c Release --no-restore -p:Platform=x64

      - name: Build botbase
        run: dotnet build src/EZBuddy.BotBase/EZBuddy.BotBase.csproj -c Release --no-restore -p:Platform=x64

      - name: Build license issuer
        run: dotnet build tools/EZBuddy.LicenseIssuer/EZBuddy.LicenseIssuer.csproj -c Release --no-restore

      - name: Build route reference scanner
        run: dotnet build tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj -c Release --no-restore

      - name: Run core tests
        run: dotnet test --project tests/EZBuddy.Core.Tests/EZBuddy.Core.Tests.csproj -c Release --no-restore

      - name: Report vulnerable packages
        shell: pwsh
        run: |
          dotnet list src/EZBuddy.Plugin/EZBuddy.Plugin.csproj package --vulnerable --include-transitive
          dotnet list src/EZBuddy.BotBase/EZBuddy.BotBase.csproj package --vulnerable --include-transitive
          dotnet list tools/EZBuddy.LicenseIssuer/EZBuddy.LicenseIssuer.csproj package --vulnerable --include-transitive
          dotnet list tools/EZBuddy.RouteReferenceScanner/EZBuddy.RouteReferenceScanner.csproj package --vulnerable --include-transitive
          dotnet list tests/EZBuddy.Core.Tests/EZBuddy.Core.Tests.csproj package --vulnerable --include-transitive

      - name: Assemble and validate package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'artifacts/EZBuddy'
          $plugin = Join-Path $root 'Plugins/EZBuddy'
          $botbase = Join-Path $root 'BotBases/EZBuddy'
          New-Item -ItemType Directory -Force -Path $plugin | Out-Null
          New-Item -ItemType Directory -Force -Path $botbase | Out-Null

          Copy-Item 'src/EZBuddy.Plugin/bin/x64/Release/net10.0-windows/*' $plugin -Recurse -Force
          Copy-Item 'src/EZBuddy.BotBase/bin/x64/Release/net10.0-windows/*' $botbase -Recurse -Force

          # Class-library builds do not automatically copy every PackageReference runtime asset.
          # EZBuddy's Windows HWID provider requires System.Management on a clean host.
          $nugetRoot = Join-Path $env:USERPROFILE '.nuget/packages'
          $management = Join-Path $nugetRoot 'system.management/10.0.0/runtimes/win/lib/net10.0/System.Management.dll'
          $codeDom = Join-Path $nugetRoot 'system.codedom/10.0.0/lib/net10.0/System.CodeDom.dll'

          if (-not (Test-Path $management)) {
            throw "Required runtime dependency missing from NuGet cache: $management"
          }

          Copy-Item $management (Join-Path $plugin 'System.Management.dll') -Force
          Copy-Item $management (Join-Path $botbase 'System.Management.dll') -Force

          # BotBase.deps.json currently contains the System.CodeDom transitive runtime dependency.
          if (Test-Path $codeDom) {
            Copy-Item $codeDom (Join-Path $botbase 'System.CodeDom.dll') -Force
          }

          Copy-Item 'README.md' $root -Force
          Copy-Item 'docs' $root -Recurse -Force

          $required = @(
            (Join-Path $plugin 'EZBuddy.Plugin.dll'),
            (Join-Path $plugin 'EZBuddy.Core.dll'),
            (Join-Path $plugin 'EZBuddy.RebornBuddy.dll'),
            (Join-Path $plugin 'EZBuddy.UI.dll'),
            (Join-Path $plugin 'System.Management.dll'),
            (Join-Path $botbase 'EZBuddy.BotBase.dll'),
            (Join-Path $botbase 'EZBuddy.Core.dll'),
            (Join-Path $botbase 'EZBuddy.RebornBuddy.dll'),
            (Join-Path $botbase 'System.Management.dll')
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Package validation failed; required file missing: $path"
            }
          }

          # Signing secrets and developer/research tools must never be distributed with the client.
          $forbidden = Get-ChildItem $root -Recurse -File | Where-Object {
            $_.Extension -in '.pem', '.pfx', '.p12', '.key' -or
            $_.Name -like '*LicenseIssuer*' -or
            $_.Name -like '*RouteReferenceScanner*'
          }
          if ($forbidden) {
            throw "Package validation failed; forbidden signing/tooling material found: $($forbidden.FullName -join ', ')"
          }

          Compress-Archive -Path "$root/*" -DestinationPath 'artifacts/EZBuddy.zip' -Force

      - name: Upload EZBuddy package
        uses: actions/upload-artifact@v4
        with:
          name: EZBuddy-package
          path: artifacts/EZBuddy.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload license issuer
        uses: actions/upload-artifact@v4
        with:
          name: EZBuddy-license-issuer
          path: tools/EZBuddy.LicenseIssuer/bin/Release/net10.0/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload route reference scanner
        uses: actions/upload-artifact@v4
        with:
          name: EZBuddy-route-reference-scanner
          path: tools/EZBuddy.RouteReferenceScanner/bin/Release/net10.0/**
          if-no-files-found: error
          retention-days: 14
